<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI助教答疑平台的登录入口">
  <title>登录 | AI助教答疑平台</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="intro" aria-labelledby="site-title">
      <a class="brand" href="index.html" aria-label="AI助教答疑平台首页">✦ AI Tutor</a>
      <div>
        <p class="eyebrow">STUDY SMARTER</p>
        <h1 id="site-title">把疑问，变成理解</h1>
        <p class="intro-copy">AI助教答疑平台会用清晰的步骤陪你梳理知识点。登录后即可开始提问。</p>
      </div>
      <p class="tip">提示：本项目使用浏览器本地存储模拟账号数据，不会上传你的信息。</p>
    </section>

    <section class="auth-card" aria-labelledby="login-title">
      <div class="card-heading">
        <p class="eyebrow">WELCOME BACK</p>
        <h2 id="login-title">登录账号</h2>
        <p>欢迎回来，继续你的学习进度。</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginAccount">手机号或邮箱</label>
          <input id="loginAccount" name="account" type="text" inputmode="email" autocomplete="username"
                 placeholder="例如：student@example.com" required aria-describedby="loginAccountHint">
          <small id="loginAccountHint">使用注册时填写的手机号或邮箱。</small>
        </div>
        <div class="field">
          <label for="loginPassword">密码</label>
          <div class="password-wrap">
            <input id="loginPassword" name="password" type="password" autocomplete="current-password"
                   placeholder="请输入密码" required minlength="8">
            <button class="text-button toggle-password" type="button" aria-label="显示密码">显示</button>
          </div>
        </div>
        <div class="form-row">
          <label class="check-label"><input name="remember" type="checkbox"> 记住我</label>
          <a href="#help">忘记密码？</a>
        </div>
        <p id="loginMessage" class="form-message" role="alert" aria-live="polite"></p>
        <button class="primary-button" type="submit">登录并开始提问 <span>→</span></button>
      </form>
      <p class="switch-auth">还没有账号？<a href="register.html">立即注册</a></p>
      <p id="help" class="help-note">演示账号：先在注册页创建一个账号，再返回此处登录。</p>
    </section>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
